name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server and protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Mosquitto (live typing tests, issue #20)
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          KABOOM_REQUIRE_MOSQUITTO: "1"
        run: pytest -m "not gui"

  server-tls:
    name: Server and protocol, encrypted (TLS, issue #19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Mosquitto (live typing tests, issue #20)
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          KABOOM_REQUIRE_MOSQUITTO: "1"
          KABOOM_TEST_TLS: "1"  # every test connection encrypted, like in production
        run: pytest -m "not gui"

  client:
    name: Real game client (off-screen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system libraries for Qt (off-screen, multimedia)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libpulse-mainloop-glib0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -m gui
